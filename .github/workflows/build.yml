name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Degausser.sln
      - run: dotnet build Degausser.sln -c Release --no-restore
      - run: dotnet test tests/Degausser.Core.Tests/Degausser.Core.Tests.csproj -c Release --no-build
